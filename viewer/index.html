<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCT Hologram Viewer</title>
<style>
  :root {
    --ink: #10131f;
    --muted: #5b6070;
    --page: #ffffff;
    --desk: #2a2d33;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--desk); overflow: hidden;
               font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
  body.hld { background: var(--page); }

  /* 9:16 portrait stage, same aspect as the HLD (1080x1920 / 2160x3840) */
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 9 / 16;
           height: min(100vh, calc(100vw * 16 / 9)); max-width: 100vw;
           background: var(--page); overflow: hidden; isolation: isolate; }
  body.hld #stage { height: 100vh; width: 100vw; aspect-ratio: auto; }
  canvas { display: block; width: 100%; height: 100%; }

  /* Alcove simulation: the HLD multiplies the image over a physical box.
     White pixels show the box; colours and darks sit on top of it. */
  #alcove { position: absolute; inset: 0; display: none; z-index: 0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.18), transparent 12%),
      linear-gradient(to top, rgba(0,0,0,.10), transparent 30%),
      linear-gradient(to right, rgba(0,0,0,.16), transparent 14%, transparent 86%, rgba(0,0,0,.16)),
      radial-gradient(ellipse 70% 45% at 50% 55%, #f4efe6, #cfc7b9 75%, #a69d8f); }
  #alcove::after { content: ""; position: absolute; left: 12%; right: 12%; top: 14%; bottom: 22%;
    border: 1px solid rgba(0,0,0,.12); box-shadow: inset 0 0 60px rgba(0,0,0,.18); }
  body.sim #alcove { display: block; }
  body.sim canvas { position: relative; z-index: 1; mix-blend-mode: multiply; }

  /* overlay text: dark, no panel. On the HLD it floats on the front glass */
  .overlay { position: absolute; left: 5%; right: 5%; z-index: 2; pointer-events: none; }
  #info { bottom: 4%; font-size: clamp(11px, 1.9vh, 26px); }
  #info h1 { font-size: 1.15em; margin: 0 0 .5em; font-weight: 650; line-height: 1.25; }
  #info .row { display: flex; align-items: center; gap: .6em; margin: .2em 0; }
  #info .sw { width: .9em; height: .9em; border-radius: 2px; flex: none; }
  #info .total { font-weight: 650; margin-top: .3em; }
  #info .fine { color: var(--muted); font-size: .72em; margin-top: .8em; }
  #status { top: 3%; font-size: clamp(10px, 1.5vh, 20px); color: var(--muted); }
  #help { top: 3%; right: 5%; left: auto; text-align: left; font-size: clamp(10px, 1.45vh, 19px);
          color: var(--muted); display: none; white-space: pre; font-family: ui-monospace, Consolas, monospace; }
  body.help #help { display: block; }
  body.hide-info #info, body.hide-info #status { display: none; }
  #error { position: absolute; inset: 0; display: none; place-items: center; padding: 10%;
           text-align: center; z-index: 3; color: #8a1c1c; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage">
  <div id="alcove"></div>
  <div id="status" class="overlay"></div>
  <div id="help" class="overlay"></div>
  <div id="info" class="overlay"></div>
  <div id="error"></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
